name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  browser-smoke:
    name: Sandboxed browser smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:4173/
      - name: Capture sandboxed browser screenshot
        run: |
          google-chrome --version
          timeout 45s google-chrome --headless=new --disable-gpu --window-size=1440,900 \
            --screenshot=browser-smoke.png http://127.0.0.1:4173/
          test -s browser-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke.png
          if-no-files-found: error
